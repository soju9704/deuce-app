<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--green:#1a6b4a;--gl:#e8f5ee;--sand:#f5f0e8;--text:#1a1a1a;--text2:#555;--text3:#888;--white:#fff;--border:#e0d8cc;--r:16px;--rs:10px;--shadow:0 2px 12px rgba(0,0,0,.07)}

.header{background:var(--white);border-bottom:1px solid var(--border);padding:0 16px;height:54px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 1px 8px rgba(0,0,0,.04)}
.logo{display:flex;align-items:center;gap:8px;text-decoration:none}
.logo-icon{width:32px;height:32px;background:var(--green);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px}
.logo-text{font-family:'DM Serif Display',serif;font-size:20px;color:var(--green)}
.back-btn{padding:6px 14px;border-radius:20px;border:1px solid var(--border);font-family:inherit;font-size:12px;cursor:pointer;background:transparent;color:var(--text2);text-decoration:none}
.hero{background:linear-gradient(135deg,#1a6b4a,#2d9062);padding:20px 16px;color:#fff}
.hero-title{font-family:'DM Serif Display',serif;font-size:22px;margin-bottom:4px}
.hero-sub{font-size:12px;opacity:.85;line-height:1.6;margin-bottom:12px}
.hero-link{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.15);padding:6px 12px;border-radius:20px;font-size:11px;color:#fff;text-decoration:none;font-weight:500}
.info-banner{margin:12px 14px 0;background:var(--gl);border-radius:var(--r);padding:12px 14px;border:1px solid rgba(26,107,74,.2);font-size:12px;color:var(--text2);line-height:1.7}
.info-banner b{color:var(--green)}
.filter-wrap{background:var(--white);padding:12px 16px;box-shadow:var(--shadow);position:sticky;top:54px;z-index:90}
.search-input{width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:var(--rs);font-family:inherit;font-size:13px;background:var(--sand);outline:none;margin-bottom:10px}
.search-input:focus{border-color:var(--green);background:var(--white)}
.region-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.fi label{display:block;font-size:10px;color:var(--text3);margin-bottom:4px;font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.fi select{width:100%;padding:8px 10px;border:1.5px solid var(--border);border-radius:var(--rs);font-family:inherit;font-size:13px;background:var(--sand);color:var(--text);outline:none}
.fi select:focus{border-color:var(--green)}

.chip-row{display:flex;gap:5px;flex-wrap:wrap}
.chip{padding:5px 11px;border-radius:20px;border:1px solid var(--border);font-size:12px;cursor:pointer;background:var(--white);color:var(--text2);font-family:inherit;font-weight:500;transition:all .15s}
.chip.on{background:var(--green);color:#fff;border-color:var(--green)}
.result-count{font-size:11px;color:var(--text3);padding:8px 16px}
.courts-list{padding:10px 14px;display:flex;flex-direction:column;gap:10px;margin-bottom:80px}
.court-card{background:var(--white);border-radius:var(--r);border:1px solid var(--border);overflow:hidden;box-shadow:var(--shadow)}
.card-top{padding:14px 16px}
.card-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:8px}
.court-name{font-size:15px;font-weight:700;margin-bottom:3px}
.court-badge{font-size:11px;color:var(--green);font-weight:600;background:var(--gl);padding:2px 8px;border-radius:8px;display:inline-block}
.court-meta{display:flex;flex-direction:column;gap:4px;margin:8px 0}
.meta-row{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text2)}
.meta-icon{font-size:13px;width:16px;text-align:center;flex-shrink:0}
.open-time{color:#e67700;font-weight:600}
.tag-row{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}
.tag{padding:3px 9px;border-radius:8px;font-size:10px;font-weight:600}
.tag-outdoor{background:#e8f5ee;color:#1a6b4a}
.tag-indoor{background:#e8f0fe;color:#3b5bdb}
.tag-clay{background:#fff3e0;color:#e65100}

// 데이터 있는 지역
const HAS_DATA = new Set(COURTS.map(c=>c.province));

let curType = '';

function onProvince() {
  const p = document.getElementById('f-province').value;
  const cs = document.getElementById('f-city');
  cs.innerHTML = '<option value="">전체</option>';
  if (p && SUB[p]) { cs.disabled=false; SUB[p].forEach(v=>{const o=document.createElement('option');o.value=o.textContent=v;cs.appendChild(o);}); }
  else cs.disabled=true;
  render();
}

function setType(btn, val) {
  document.querySelectorAll('#type-chips .chip').forEach(c=>c.classList.remove('on'));
  btn.classList.add('on'); curType=val; render();
}

function render() {
  const p=document.getElementById('f-province').value;
  const c=document.getElementById('f-city').value;
  const q=document.getElementById('search-input').value.toLowerCase();

  // 데이터 없는 지역 선택 시
  if (p && !HAS_DATA.has(p)) {
    document.getElementById('result-count').textContent='';
    document.getElementById('courts-list').innerHTML=`
      <div class="coming-soon">
        <div class="cs-icon">🚧</div>
        <div class="cs-title">${p} 데이터 수집 중입니다</div>
        <div class="cs-desc">${p} 지역 공공 테니스장 정보를 수집 중이에요.<br>빠르게 업데이트할게요!</div>
        <a href="https://yeyak.seoul.go.kr" target="_blank" style="display:inline-block;padding:10px 20px;background:var(--green);color:#fff;border-radius:10px;font-size:13px;font-weight:600;text-decoration:none">서울시 공공서비스예약 →</a>
      </div>`;
    return;
  }

  let list = COURTS.filter(ct => {
    const mP=!p||ct.province===p;
    const mC=!c||ct.city===c;
    const mT=!curType||ct.type.includes(curType);
    const mQ=!q||ct.name.includes(q)||ct.city.includes(q)||ct.addr.includes(q);
    return mP&&mC&&mT&&mQ;
  });

  document.getElementById('result-count').textContent=`${list.length}개`;

  if (!list.length) { document.getElementById('courts-list').innerHTML='<div class="empty">조건에 맞는 테니스장이 없습니다</div>'; return; }

  document.getElementById('courts-list').innerHTML=list.map(ct=>{
    const typeTags=ct.type.map(t=>`<span class="tag ${t==='야외'?'tag-outdoor':'tag-indoor'}">${t==='야외'?'🌳':'🏠'} ${t}</span>`).join('');
    const surfTags=ct.surface.map(s=>`<span class="tag ${s==='클레이'?'tag-clay':'tag-hard'}">${s}</span>`).join('');
    const phoneRow=ct.phone?`<div class="meta-row"><span class="meta-icon">📞</span><a href="tel:${ct.phone}" style="color:var(--green);font-weight:600">${ct.phone}</a></div>`:'';
    return `<div class="court-card">
      <div class="card-top">
        <div class="card-header">
          <div><div class="court-name">${ct.name}</div><span class="court-badge">${ct.province} ${ct.city}</span></div>
          <div style="font-size:20px">🏟️</div>
        </div>
        <div class="court-meta">
          <div class="meta-row"><span class="meta-icon">📍</span>${ct.addr}</div>
          <div class="meta-row"><span class="meta-icon">⏰</span>운영: ${ct.hours}</div>
          <div class="meta-row"><span class="meta-icon">🎾</span>코트 ${ct.count}면</div>
          <div class="meta-row"><span class="meta-icon">📅</span><span class="open-time">예약 오픈: ${ct.openTime}</span></div>
          ${phoneRow}
        </div>
        <div class="tag-row">${typeTags}${surfTags}<span class="tag" style="background:#fef9e7;color:#b7950b">💰 유료</span></div>
        <div class="choice-box">
          <div class="choice-title">🎾 이 코트에서 레슨 받으려면?</div>
          <div class="choice-btns">
            <a href="index.html" class="choice-btn-p">👨‍🏫 코치 매칭</a>
            <a href="${ct.reserveUrl}" target="_blank" class="choice-btn-s">🏟️ 직접 예약</a>
          </div>
          <div class="choice-hint">코치 매칭 → 코치가 코트를 함께 알아봐드려요</div>
        </div>
      </div>
      <div class="card-bottom">
        <a href="${ct.reserveUrl}" target="_blank" class="btn-reserve">📅 예약 바로가기</a>
        <a href="${ct.mapUrl}" target="_blank" class="btn-map">🗺️ 지도</a>
      </div>
    </div>`;
  }).join('');
}

render();
</script>
